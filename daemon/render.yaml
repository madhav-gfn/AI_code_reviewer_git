services:
  - type: web
    name: mygit-api-prototype
    runtime: docker
    dockerfilePath: ./daemon/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /live
    envVars:
      - key: MYGIT_SERVER_MODE
        value: hosted
      - key: MYGIT_INFERENCE_BACKEND
        value: stub
      - key: MYGIT_API_TOKEN
        sync: false
